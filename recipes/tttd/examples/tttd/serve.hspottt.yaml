# Stepping-stone SPO-TTT on the TTT-Discover search: TTTD_METHOD=hspottt ./run.sh
#
# SPO-TTT (serve.spottt.yaml) with hindsight credit: an attempt that a later
# successful attempt descends from, and that did not succeed itself, is
# trained once more stone_window steps after it was sampled, with the credit
# it earned as its advantage. Every step's own attempts train exactly as in
# SPO-TTT, on the same two GPUs. TTTD_STATE_DIR and REEF_INFERENCE_HOST come
# from run.sh.

run_dir: ${TTTD_STATE_DIR}/stack
ready_timeout: 3600

# Service processes launch locally; Slime owns distributed GPU model workers.
execution:
  training: ray
  rollout: ray

reef:
  host: 127.0.0.1
  model_path: work/model
  port: ${TTTD_REEF_PORT:?}
  recipe: recipes.hspottt.recipe:HSPOTTTRecipe
  token: reef-local
  groups_per_step: 8
  rollouts_per_group: 64
  # Share outcomes across attempts from the same archive state; a state seen
  # for the first time starts from its parent's estimate, then the task's.
  baseline: node
  normalize_advantages: true
  # Forgetting per committed policy step: rho = 2^(-1/half_life), clipped to
  # [rho_min, rho_max] (SPO's bounds, windows of 8 to 25 observations).
  half_life: 8.0
  rho_min: 0.875
  rho_max: 0.96
  inherit_fraction: 0.5
  # PPO-TTT's update schedule, so the two differ only in the baseline.
  ppo_epochs: 1
  minibatch_size: 128
  shuffle_minibatches: true
  # Stepping stones. A success is an attempt among the step's best 5% with a
  # program (stone_success: best instead counts only new best scores). A kept
  # attempt that did not succeed itself earns stone_credit (in units of the
  # fresh advantages' spread) when an attempt grown from it succeeds, and
  # stone_discount of that per generation further up, stone_generations up.
  # It waits stone_window steps for descendants, then trains once more if it
  # earned credit. The best stone_keep_per_parent attempts of each parent in a
  # step are kept: the archive keeps two children per state.
  stone_window: 3
  stone_generations: 3
  stone_discount: 0.5
  stone_credit: 1.0
  stone_success: top
  stone_top_fraction: 0.05
  stone_keep_per_parent: 2
  stone_tolerance: 1.0e-9
  # The store each step is planned from, so a step built again after a reload
  # or restart is identical and the trainer recognises a job it already ran.
  stone_dir: ${TTTD_STATE_DIR}/stones
  # Replays are stone_window policy versions old; the trainer admits samples
  # up to this many versions old (and refuses a batch holding an older one).
  max_staleness: 3
  # A durable checkpoint every step: a restart restores the last checkpoint,
  # and the run controller resumes only from the step its archive recorded.
  checkpoint_every_n_versions: 1
  ray_namespace: reef
  ray_actor_name: reef-train-bridge
  inference_timeout_s: 7200
  train_timeout_s: 7200
  inference_backend_factory: reef.train.slime_backend.reef_adapters.sglang.chat.SGLangChatTrainingInferenceBackend
  artifact_repository: ${TTTD_STATE_DIR}/artifacts.git
  artifact_work_dir: ${TTTD_STATE_DIR}/artifact-work
  artifact_cache_dir: ${TTTD_STATE_DIR}/artifact-cache
  agent_record_dir: ${TTTD_STATE_DIR}/agent-record
  # Keep every attempt's record (program, score, feedback) for the whole study,
  # not Reef's default 7 days after training consumes it.
  agent_record_retention_days: 90

observability:
  wandb:
    enabled: false
    project: reef
    directory: ${TTTD_STATE_DIR}/wandb

training:
  num_gpus: 2
  # The grid and completion limit. The harness (harness/session.py) reads
  # these same keys, so it and the stack cannot disagree about the step.
  # The paper's 50 steps, for a comparison at the same verifier budget.
  steps: 50
  max_new_tokens: 26000
  checkpoint_dir: ${TTTD_STATE_DIR}/checkpoints
  checkpoint_retention:
    max_storage_fraction: 0.8
    min_free_space_fraction: 0.1
    policy: latest
    # Only the latest checkpoint is kept (plus the one being written): the
    # size limits above read the shared filesystem, not the user's quota.
    max_count: 1

services:
  - name: slime-driver
    command: >-
      "${REEF_PYTHON}" -m reef.train.slime_backend.reef_adapters.driver
      --hf-checkpoint=${reef.model_path}
      --load=${training.checkpoint_dir}/megatron
      --ref-load=${reef.model_path}
      --save=${training.checkpoint_dir}/megatron
      --save-hf=${training.checkpoint_dir}/hf/{rollout_id}
      --save-interval=${reef.checkpoint_every_n_versions}
      --reef-checkpoint-max-storage-fraction=${training.checkpoint_retention.max_storage_fraction}
      --reef-checkpoint-min-free-space-fraction=${training.checkpoint_retention.min_free_space_fraction}
      --reef-checkpoint-policy=${training.checkpoint_retention.policy}
      --reef-checkpoint-max-count=${training.checkpoint_retention.max_count}
      --megatron-to-hf-mode=bridge
      --num-rollout=${training.steps}
      --rollout-batch-size=${reef.groups_per_step}
      --n-samples-per-prompt=${reef.rollouts_per_group}
      --global-batch-size=512
      --disable-rollout-global-dataset
      --actor-num-nodes=1
      --actor-num-gpus-per-node=${training.num_gpus}
      --rollout-num-gpus=${training.num_gpus}
      --rollout-num-gpus-per-engine=1
      --num-gpus-per-node=${training.num_gpus}
      --colocate
      --tensor-model-parallel-size=2
      --pipeline-model-parallel-size=1
      --context-parallel-size=1
      --expert-model-parallel-size=1
      --expert-tensor-parallel-size=1
      --padded-vocab-size=151936
      --position-embedding-type=rope
      --rotary-base=1000000
      --swiglu
      --disable-bias-linear
      --normalization=RMSNorm
      --group-query-attention
      --qk-layernorm
      --seq-length=${TTTD_SEQ_LENGTH}
      --use-dynamic-batch-size
      --max-tokens-per-gpu=${TTTD_MAX_TOKENS_PER_GPU}
      --recompute-granularity=full
      --recompute-method=uniform
      --recompute-num-layers=1
      --megatron-lora-rank=32
      --megatron-lora-alpha=32
      --megatron-lora-dropout=0
      --megatron-lora-target-modules
      linear_qkv linear_proj linear_fc1 linear_fc2
      --check-lora-weight-equal
      --verify-lora-base-weights
      --optimizer=adam
      --lr=4e-5
      --lr-decay-style=constant
      --override-opt-param-scheduler
      --weight-decay=0
      --adam-beta1=0.9
      --adam-beta2=0.95
      --adam-eps=1e-8
      --clip-grad=0
      --loss-type=policy_loss
      --eps-clip=0.2
      --use-rollout-logprobs
      --kl-coef=0.1
      --entropy-coef=0
      --rollout-temperature=1
      --rollout-max-response-len=30000
      --rollout-max-context-len=30000
      --sglang-context-length=30000
      --sglang-router-port=${TTTD_ROUTER_PORT:?}
      --sglang-mem-fraction-static=0.7
      --sglang-disable-prefill-cuda-graph
      --sglang-cuda-graph-max-bs-decode=128
      --train-env-vars='{"PYTORCH_CUDA_ALLOC_CONF":"max_split_size_mb:512"}'
      --log-probs-chunk-size=${TTTD_LOG_PROBS_CHUNK_SIZE}
      --attention-dropout=0
      --hidden-dropout=0
      --accumulate-allreduce-grads-in-fp32
      --attention-softmax-in-fp32
      --attention-backend=flash
    ready: test -f "$REEF_BRIDGE_READY_FILE"
    ready_timeout: 3600
    env:
      REEF_RAY_NAMESPACE: reef
      REEF_RAY_ACTOR_NAME: reef-train-bridge
      CUDA_DEVICE_MAX_CONNECTIONS: "1"
      NCCL_NVLS_ENABLE: "0"

  - name: reef
    command: ["${REEF_PYTHON}", "-m", "reef.service"]
    ready: curl -sf http://127.0.0.1:${reef.port}/healthz
    ready_timeout: 120
    depends_on: [slime-driver]
